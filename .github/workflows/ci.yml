name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build library
        run: make libatme.a
      - name: Build benchmarks
        run: make atm_bench
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libatme.a
          path: libatme.a
